[package]
name = "rengi-snap"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast native screenshot and screen recording tool for Windows"
repository = "https://github.com/MRRengi/rng-snap"

[[bin]]
name = "RengiSnap"
path = "src/main.rs"

[dependencies]
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls",
  "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
