[package]
name = "rengi-snap"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Fast native screenshot and screen recording tool for Windows"
repository = "https://github.com/MRRengi/rng-snap"

[[bin]]
name = "RengiSnap"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
gif = "0.14"
png = "0.18"
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Security",
  "Security_Authorization",
  "Security_Authorization_AppCapabilityAccess",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Dxgi",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_System_Performance",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_Properties",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
