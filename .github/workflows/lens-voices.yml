name: lens-voices
on:
  push:
    branches: [lens-media]
    paths: ['lens/voices.py']
permissions:
  contents: write
jobs:
  cast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cast
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          pip install -q requests
          python3 lens/voices.py results/cast
      - name: Publish
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan lens-voices-results
          git rm -rf --cached . > /dev/null
          git add -f results
          git commit -q -m "ci: lens voices ${{ github.run_number }}"
          git push -f origin lens-voices-results
