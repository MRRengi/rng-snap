name: ci
on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          cargo test --release --bins 2>&1 | Tee-Object results/unit.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object results/build.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: End-to-end test on the runner desktop
        shell: pwsh
        run: |
          ./target/release/e2e.exe ./target/release/RengiSnap.exe results 2>&1 | Tee-Object results/e2e-console.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build setup and portable zip
        shell: pwsh
        run: ./installer/build.ps1 2>&1 | Tee-Object results/installer-build.txt
      - name: Installer test
        shell: pwsh
        run: ./installer/test.ps1 results
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: RengiSnap
          path: |
            target/installer/RengiSnap-Setup-*.exe
            target/installer/RengiSnap-*-portable.zip
      - name: Check for a new version
        id: ver
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          gh release view "v$v" --repo ${{ github.repository }} *> $null
          $new = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, new release: $new"
          $global:LASTEXITCODE = 0
      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Rengi Snap ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            target/installer/RengiSnap-Setup-*.exe
            target/installer/RengiSnap-*-portable.zip
          body_path: docs/release-notes.md
      - name: Publish results branch
        if: always()
        shell: pwsh
        run: |
          if (Test-Path results/home/log.txt) { Copy-Item results/home/log.txt results/app-log.txt }
          if (Test-Path results/home) { Remove-Item -Recurse -Force results/home }
          if (Test-Path target/release/RengiSnap.exe) { Copy-Item target/release/RengiSnap.exe results/ }
          Get-ChildItem target/installer -File -ErrorAction SilentlyContinue | Copy-Item -Destination results/
          if (Test-Path results/inst-home) { Remove-Item -Recurse -Force results/inst-home }
          "${{ github.sha }} run ${{ github.run_number }} ${{ job.status }}" | Out-File results/run.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-results
          git rm -rf --cached . | Out-Null
          git add -f results
          git commit -q -m "ci: results ${{ github.run_number }}"
          git push -f origin ci-results
