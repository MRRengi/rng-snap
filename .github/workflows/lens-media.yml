name: lens-media
on:
  push:
    branches: [lens-media]
    paths-ignore: ['lens/voices.py', 'lens/keynote*', 'lens/screencast*', '.github/workflows/lens-*.yml', 'lens/edit/**', 'lens/film/**']

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock footage (Mixkit, free license)
        run: |
          mkdir -p results/stock
          for id in 10446; do
            curl -sSfL -o results/stock/$id-1080.mp4 https://assets.mixkit.co/videos/$id/$id-1080.mp4 || \
            curl -sSfL -o results/stock/$id-720.mp4 https://assets.mixkit.co/videos/$id/$id-720.mp4 || echo "miss $id"
          done
          ls -la results/stock
      - name: Voice and music
        if: always()
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          pip install -q requests
          python3 lens/narrate.py results/voice
      - name: Publish
        if: always()
        run: |
          echo "${{ github.sha }} run ${{ github.run_number }}" > results/run.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan lens-media-results
          git rm -rf --cached . > /dev/null
          git add -f results
          git commit -q -m "ci: lens media ${{ github.run_number }}"
          git push -f origin lens-media-results
